server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: kronos-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: kronos-backend
          application: kronos-backend
          environment: ${APP_ENV}
          __path__: /var/log/kronos/kronos-backend.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            environment: environment
            logger_name: logger_name
            event: event
            result: result
            reason: reason
            message: message
            trace_id: trace_id
            span_id: span_id
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          service:
          environment:
          event:
          result:
