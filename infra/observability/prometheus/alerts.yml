groups:
  - name: kronos-observability
    rules:
      - alert: KronosBackendDown
        expr: up{job="kronos-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: KRONOS backend indisponivel
          description: O target kronos-backend deixou de responder ao Prometheus.

      - alert: KronosBackendHttp5xxHigh
        expr: sum(rate(http_server_requests_seconds_count{job="kronos-backend",status=~"5.."}[5m])) > 0.2
        for: 5m
        labels:
          severity: high
        annotations:
          summary: KRONOS com erros HTTP 5xx
          description: A API principal esta retornando erro 5xx.

      - alert: KronosBackendLatencyAverageHigh
        expr: sum(rate(http_server_requests_seconds_sum{job="kronos-backend"}[5m])) / sum(rate(http_server_requests_seconds_count{job="kronos-backend"}[5m])) > 2
        for: 10m
        labels:
          severity: high
        annotations:
          summary: KRONOS com latencia media elevada
          description: A latencia media da API excedeu 2s.

      - alert: KronosAuthFailureSpike
        expr: increase(kronos_auth_login_total{result="failure"}[10m]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Pico de falhas de autenticacao
          description: O total de falhas de login excedeu o limite nos ultimos 10 minutos.

      - alert: KronosFaceLoginFailureSpike
        expr: increase(kronos_auth_login_total{method="face",result="failure"}[10m]) > 5
        for: 5m
        labels:
          severity: high
        annotations:
          summary: Pico de falhas no login facial
          description: O total de falhas de autenticacao facial ultrapassou o limite nos ultimos 10 minutos.

      - alert: KronosLegalFailure
        expr: increase(kronos_legal_generation_total{result="failure"}[15m]) > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: Falha na geracao de documentos legais
          description: A geracao de AFD, AEJ, espelho ou atestado tecnico falhou.

      - alert: KronosRetentionApplyFailure
        expr: increase(kronos_retention_execution_total{mode="apply",result="failure"}[30m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Falha na aplicacao de retention
          description: A execucao APPLY de retention falhou e exige intervencao.

      - alert: KronosNtpDriftHigh
        expr: abs(kronos_ntp_drift_seconds) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Drift NTP acima do limite
          description: O desvio entre o horario local e o NTP excedeu 5 segundos.

      - alert: KronosFrontendErrorSpike
        expr: increase(kronos_frontend_event_total{result="failure"}[10m]) > 10
        for: 5m
        labels:
          severity: high
        annotations:
          summary: Pico de erros no front-end
          description: Eventos de erro do front-end cresceram acima do limite nos ultimos 10 minutos.
