groups:

  # ═══════════════════════════════════════════════════════════════
  # INFRAESTRUTURA
  # ═══════════════════════════════════════════════════════════════
  - name: kronos-infra
    rules:

      - alert: KronosBackendDown
        expr: up{job="kronos-backend"} == 0
        for: 1m
        labels:
          severity: critical
          category: infra
        annotations:
          summary: "Backend KRONOS indisponivel"
          description: "O Prometheus nao consegue scrapeaar o backend. Verifique o processo kronos-backend na VPS."

      - alert: KronosCpuHigh
        expr: process_cpu_usage{application="kronos-backend"} > 0.85
        for: 5m
        labels:
          severity: high
          category: infra
        annotations:
          summary: "CPU do backend em {{ $value | humanizePercentage }}"
          description: "O processo Java esta consumindo mais de 85% de CPU por mais de 5 minutos."

      - alert: KronosHeapMemoryHigh
        expr: >
          sum(jvm_memory_used_bytes{application="kronos-backend", area="heap"})
          /
          sum(jvm_memory_committed_bytes{application="kronos-backend", area="heap"})
          > 0.85
        for: 5m
        labels:
          severity: high
          category: infra
        annotations:
          summary: "Heap JVM em {{ $value | humanizePercentage }}"
          description: "Uso de heap acima de 85% do committed. Risco de OutOfMemoryError."

      - alert: KronosHeapMemoryCritical
        expr: >
          sum(jvm_memory_used_bytes{application="kronos-backend", area="heap"})
          /
          sum(jvm_memory_committed_bytes{application="kronos-backend", area="heap"})
          > 0.95
        for: 2m
        labels:
          severity: critical
          category: infra
        annotations:
          summary: "Heap JVM critica: {{ $value | humanizePercentage }}"
          description: "Heap acima de 95%. OutOfMemoryError iminente. Reinicializacao pode ser necessaria."

      - alert: KronosGcOverheadHigh
        expr: jvm_gc_overhead{application="kronos-backend"} > 0.25
        for: 5m
        labels:
          severity: high
          category: infra
        annotations:
          summary: "GC overhead em {{ $value | humanizePercentage }}"
          description: "O GC esta consumindo mais de 25% do CPU. Possivel memory leak."

      - alert: KronosDiskSpaceLow
        expr: disk_free_bytes{application="kronos-backend"} / disk_total_bytes{application="kronos-backend"} < 0.15
        for: 5m
        labels:
          severity: high
          category: infra
        annotations:
          summary: "Espaco em disco em {{ $value | humanizePercentage }} livre"
          description: "Menos de 15% de espaco livre no disco da aplicacao."

  # ═══════════════════════════════════════════════════════════════
  # BANCO DE DADOS
  # ═══════════════════════════════════════════════════════════════
  - name: kronos-database
    rules:

      - alert: KronosDbPoolExhausted
        expr: >
          hikaricp_connections_active{application="kronos-backend"}
          /
          hikaricp_connections_max{application="kronos-backend"}
          > 0.9
        for: 2m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "Pool de conexoes DB em {{ $value | humanizePercentage }}"
          description: "Mais de 90% das conexoes do HikariCP estao em uso. Risco de timeout de conexao."

      - alert: KronosDbConnectionTimeout
        expr: increase(hikaricp_connections_timeout_total{application="kronos-backend"}[5m]) > 0
        for: 1m
        labels:
          severity: high
          category: database
        annotations:
          summary: "Timeout de conexao ao banco detectado"
          description: "{{ $value }} conexoes falharam por timeout nos ultimos 5 minutos."

      - alert: KronosDbPendingConnections
        expr: hikaricp_connections_pending{application="kronos-backend"} > 5
        for: 2m
        labels:
          severity: high
          category: database
        annotations:
          summary: "{{ $value }} threads aguardando conexao DB"
          description: "Fila de espera por conexao acima de 5 por mais de 2 minutos."

  # ═══════════════════════════════════════════════════════════════
  # API HTTP
  # ═══════════════════════════════════════════════════════════════
  - name: kronos-api
    rules:

      - alert: KronosHttp5xxHigh
        expr: >
          sum(rate(http_server_requests_seconds_count{application="kronos-backend", status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{application="kronos-backend"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: high
          category: api
        annotations:
          summary: "Taxa de erros 5xx em {{ $value | humanizePercentage }}"
          description: "Mais de 5% das requisicoes estao retornando erro 5xx por 5 minutos."

      - alert: KronosHttp5xxCritical
        expr: >
          sum(rate(http_server_requests_seconds_count{application="kronos-backend", status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{application="kronos-backend"}[5m]))
          > 0.25
        for: 2m
        labels:
          severity: critical
          category: api
        annotations:
          summary: "CRITICO: Taxa de erros 5xx em {{ $value | humanizePercentage }}"
          description: "Mais de 25% das requisicoes retornando erro 5xx. Provavel falha critica no backend."

      - alert: KronosLatencyHigh
        expr: >
          sum(rate(http_server_requests_seconds_sum{application="kronos-backend"}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{application="kronos-backend"}[5m]))
          > 2
        for: 10m
        labels:
          severity: high
          category: api
        annotations:
          summary: "Latencia media da API: {{ $value | humanizeDuration }}"
          description: "A latencia media superou 2 segundos por mais de 10 minutos."

      - alert: KronosLatencyCritical
        expr: >
          sum(rate(http_server_requests_seconds_sum{application="kronos-backend"}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{application="kronos-backend"}[5m]))
          > 5
        for: 3m
        labels:
          severity: critical
          category: api
        annotations:
          summary: "CRITICO: Latencia media da API: {{ $value | humanizeDuration }}"
          description: "A latencia media superou 5 segundos. Possivel degradacao severa do servico."

  # ═══════════════════════════════════════════════════════════════
  # SEGURANÇA E AUTENTICAÇÃO
  # ═══════════════════════════════════════════════════════════════
  - name: kronos-security
    rules:

      - alert: KronosBruteForcePassword
        expr: increase(kronos_auth_login_total{method="password", result="failure"}[5m]) > 10
        for: 2m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Possivel brute force: {{ $value }} falhas de login (senha) em 5min"
          description: "Pico de falhas de autenticacao por senha detectado. Verifique logs para identificar IP de origem."

      - alert: KronosBruteForceFace
        expr: increase(kronos_auth_login_total{method="face", result="failure"}[5m]) > 5
        for: 2m
        labels:
          severity: high
          category: security
        annotations:
          summary: "Possivel ataque facial: {{ $value }} falhas de login biometrico em 5min"
          description: "Pico de falhas de autenticacao biometrica detectado."

      - alert: KronosRateLimitBlocking
        expr: increase(kronos_redis_rate_limit_blocked_total[5m]) > 20
        for: 2m
        labels:
          severity: high
          category: security
        annotations:
          summary: "Rate limiting bloqueou {{ $value }} requisicoes em 5min"
          description: "Volume elevado de requisicoes bloqueadas por rate limiting. Possivel ataque DDoS ou bot."

      - alert: KronosRateLimitCritical
        expr: increase(kronos_redis_rate_limit_blocked_total[1m]) > 50
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "CRITICO: {{ $value }} bloqueios de rate limit em 1 minuto"
          description: "Volume extremo de bloqueios. Possivel ataque DDoS ativo."

      - alert: KronosHttp401Spike
        expr: increase(http_server_requests_seconds_count{application="kronos-backend", status="401"}[5m]) > 15
        for: 2m
        labels:
          severity: high
          category: security
        annotations:
          summary: "{{ $value }} respostas HTTP 401 em 5min"
          description: "Pico de erros de autorizacao. Possivel tentativa de acesso nao autorizado."

      - alert: KronosRedisUnavailable
        expr: increase(kronos_redis_unavailable_total[2m]) > 0
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Redis indisponivel - rate limiting comprometido"
          description: "O backend detectou falha de conexao com Redis. Rate limiting e cache podem estar falhando."

  # ═══════════════════════════════════════════════════════════════
  # NTP / INTEGRIDADE DE HORÁRIO
  # ═══════════════════════════════════════════════════════════════
  - name: kronos-ntp
    rules:

      - alert: KronosNtpDriftHigh
        expr: abs(kronos_ntp_drift_seconds) > 2
        for: 2m
        labels:
          severity: high
          category: ntp
        annotations:
          summary: "Drift NTP em {{ $value }}s"
          description: "Desvio de horario acima de 2 segundos. Registros de ponto podem ser imprecisos."

      - alert: KronosNtpDriftCritical
        expr: abs(kronos_ntp_drift_seconds) > 5
        for: 1m
        labels:
          severity: critical
          category: ntp
        annotations:
          summary: "CRITICO: Drift NTP em {{ $value }}s"
          description: "Desvio de horario acima de 5 segundos. Conformidade trabalhista comprometida."

      - alert: KronosNtpSyncFailing
        expr: increase(kronos_scheduler_execution_total{scheduler="time_sync", result="failure"}[10m]) > 0
        for: 5m
        labels:
          severity: high
          category: ntp
        annotations:
          summary: "Sincronizacao NTP falhando"
          description: "O scheduler de sincronizacao de tempo falhou. Verificar conectividade com servidor NTP."

  # ═══════════════════════════════════════════════════════════════
  # LOGS DE ERROS
  # ═══════════════════════════════════════════════════════════════
  - name: kronos-logs
    rules:

      - alert: KronosErrorLogSpike
        expr: increase(logback_events_total{application="kronos-backend", level="error"}[5m]) > 10
        for: 2m
        labels:
          severity: high
          category: logs
        annotations:
          summary: "{{ $value }} logs de erro em 5 minutos"
          description: "Pico de logs ERROR no backend. Verifique o dashboard KRONOS Logs para detalhes."
