global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: kronos-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 172.20.0.1:8080
