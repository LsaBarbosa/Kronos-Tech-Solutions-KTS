            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              datasource:
                type: prometheus
                uid: Prometheus
              editorMode: code
              expr: increase(kronos_frontend_event_total{result="failure"}[10m])
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: ""

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - type: query
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params:
                      - 10
                  operator:
                    type: and

        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: high
          service: kronos-frontend
          source: grafana-managed
        annotations:
          summary: Pico de erros no front-end
          description: Eventos de erro do front-end cresceram acima do limite nos últimos 10 minutos.