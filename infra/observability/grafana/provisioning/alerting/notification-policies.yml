apiVersion: 1

policies:
  - orgId: 1
    receiver: Kronos Email Admin

    group_by:
      - grafana_folder
      - alertname
      - severity

    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

    routes:
      - receiver: Kronos Email Admin
        matchers:
          - severity = critical
        group_by:
          - grafana_folder
          - alertname
          - severity
        group_wait: 15s
        group_interval: 2m
        repeat_interval: 1h
        continue: false

      - receiver: Kronos Email Admin
        matchers:
          - severity = high
        group_by:
          - grafana_folder
          - alertname
          - severity
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 2h
        continue: false

      - receiver: Kronos Email Admin
        matchers:
          - severity = warning
        group_by:
          - grafana_folder
          - alertname
          - severity
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 6h
        continue: false