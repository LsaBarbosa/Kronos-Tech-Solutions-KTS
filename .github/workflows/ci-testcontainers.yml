name: CI - DataJpa with Testcontainers

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  data-jpa-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show Docker info
        run: |
          docker version
          docker info

      - name: Run DataJpa tests with Testcontainers
        env:
          USE_TESTCONTAINERS: "true"
        run: ./gradlew clean dataJpaTest --info --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-jpa-test-reports
          path: |
            build/reports/tests/**
            build/test-results/**