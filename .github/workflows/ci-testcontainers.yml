name: CI Tests

on:
  push:
    branches:
      - main
      - develop
      - "v*/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Unit + Context
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper is executable
        run: chmod +x ./gradlew

      - name: Run test suite
        run: ./gradlew test --no-daemon

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html

  datajpa-testcontainers:
    name: DataJpa + Testcontainers
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Docker is available
        run: docker version

      - name: Ensure Gradle Wrapper is executable
        run: chmod +x ./gradlew

      - name: Run DataJpaTest with Testcontainers
        run: ./gradlew test --no-daemon --tests "com.kts.kronos.adapter.out.persistence.CompanyNsrRepositoryDataJpaTest"
