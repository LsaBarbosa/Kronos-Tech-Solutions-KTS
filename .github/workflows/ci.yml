name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew clean unitTest --info --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            build/reports/tests/**
            build/test-results/**

  data-jpa-tests:
    name: Data JPA Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show Docker info
        run: |
          docker version
          docker info

      - name: Run DataJpa tests
        env:
          USE_TESTCONTAINERS: "true"
        run: ./gradlew clean dataJpaTest --info --stacktrace

      - name: Upload DataJpa reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-jpa-test-reports
          path: |
            build/reports/tests/**
            build/test-results/**