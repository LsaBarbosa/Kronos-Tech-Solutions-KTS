services:


  kronos-redis-local:
    image: redis:${REDIS_IMAGE_TAG:-7.4-alpine}
    container_name: ${REDIS_CONTAINER_NAME:-kronos-redis-local}
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD obrigatoria}
      TZ: ${TZ:-America/Sao_Paulo}

    command:
      - sh
      - -c
      - >
        exec redis-server
        --appendonly yes
        --requirepass "$$REDIS_PASSWORD"
        --protected-mode yes
        --bind 0.0.0.0
        --maxmemory-policy noeviction

    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

    volumes:
      - kronos_redis_local_data:/data

    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:

  kronos_redis_local_data:


networks:
  kronos-local-network:
    driver: bridge