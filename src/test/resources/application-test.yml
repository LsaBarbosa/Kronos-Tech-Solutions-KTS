spring:
  datasource:
    url: jdbc:h2:mem:kronos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms

  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    port: 2525
    username: test@kronos.local
    password: test
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 2000
          timeout: 2000
          writetimeout: 2000
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  health:
    redis:
      enabled: false

file:
  storage:
    root-path: /tmp/kronos-tests

app:
  security:
    public-docs-enabled: false

jwt:
  secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  expiration: 3600000

frontend:
  base-url-plataform: http://localhost:4200
  base-url-record: http://localhost:4201
  base-url-local: http://localhost:3000
  base-url-local-2: http://127.0.0.1:3000

integration:
  here:
    base-url: https://geocode.search.hereapi.com
    api-key: test-here-key

aws:
  region: us-east-1
  access-key-id: test-access-key
  secret-access-key: test-secret-key
  s3:
    bucket-name: test-bucket
    bucket-name-doc: test-bucket-docs
  rekognition:
    collection-id: test-collection

kronos:
  redis:
    enabled: false
    namespace: kronos-test
    key-hmac-secret: test-redis-secret
    cache-default-ttl: PT5M
    cache-short-ttl: PT30S
    cache-medium-ttl: PT5M
    cache-long-ttl: PT24H
    password-reset-ttl: PT30M
    lock-ttl: PT10S
  security:
    certificate:
      path: /tmp/test-cert.pfx
      password: test-password
    biometric-term-salt: test-salt
  lgpd:
    retention:
      scheduler:
        enabled: false
        cron: "0 15 4 * * ?"
