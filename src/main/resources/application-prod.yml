server:
  forward-headers-strategy: framework
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024

spring:
  application:
    name: ${APP_NAME:kronos-backend}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      initialization-fail-timeout: ${DB_INITIALIZATION_FAIL_TIMEOUT_MS:10000}
      auto-commit: true
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      jakarta.persistence.query.timeout: ${JPA_QUERY_TIMEOUT_MS:10000}
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT:2000ms}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
          debug: ${MAIL_SMTP_DEBUG:false}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    org.springframework: ${SPRING_SECURITY_LOG_LEVEL:INFO}
    org.springframework.security: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    br.com: INFO
  pattern:
    console: ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE:health,prometheus}
        exclude: env,heapdump,beans,configprops,threaddump,flyway,logfile,loggers
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      livenessState:
        enabled: true
      readinessState:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:true}
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:true}
  metrics:
    export:
      prometheus:
        enabled: true

app:
  security:
    public-docs-enabled: ${APP_SECURITY_PUBLIC_DOCS_ENABLED:false}
    cookies:
      http-only: true
      secure: true
      same-site: "None"
    csrf:
      cookie-name: KRONOS_CSRF_TOKEN
      header-name: X-CSRF-TOKEN
      cookie-path: /
      secure: true
      same-site: "None"

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}

frontend:
  base-url-plataform: ${FRONTEND_BASE_URL_PLATAFORM}
  base-url-record: ${FRONTEND_BASE_URL_RECORD}
  base-url-local: ${FRONTEND_BASE_URL_LOCAL}
  base-url-local-2: ${FRONTEND_BASE_URL_LOCAL_2}
  allowed-origins: ${FRONTEND_ALLOWED_ORIGINS}

file:
  storage:
    root-path: ${FILE_STORAGE_ROOT_PATH:/opt/kronos/documents}

integration:
  here:
    base-url: ${HERE_BASE_URL:https://geocode.search.hereapi.com}
    api-key: ${HERE_API_KEY:}

aws:
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    bucket-name-doc: ${AWS_S3_BUCKET_NAME_DOCS}
    bucket-payslip: ${AWS_S3_BUCKET_PAYSLIP:kronos-docs-payslip-prod}
    bucket-time-off: ${AWS_S3_BUCKET_TIME_OFF:kronos-docs-time-off-prod}
    bucket-documents: ${AWS_S3_BUCKET_DOCUMENTS:kronos-docs-general-prod}
    bucket-employee-documents: ${AWS_S3_BUCKET_EMPLOYEE_DOCUMENTS:kronos-docs-employee-prod}
    bucket-point-record-receipt: ${AWS_S3_BUCKET_POINT_RECORD_RECEIPT:kronos-docs-point-record-receipt-prod}
    bucket-biometric-consent-term: ${AWS_S3_BUCKET_BIOMETRIC_CONSENT_TERM:kronos-docs-biometric-consent-prod}
    bucket-service-contract-terms: ${AWS_S3_BUCKET_SERVICE_CONTRACT_TERMS:kronos-docs-service-contract-prod}
    bucket-point-mirror-signature: ${AWS_S3_BUCKET_POINT_MIRROR_SIGNATURE:kronos-docs-point-mirror-signature-prod}
    bucket-face-images: ${AWS_S3_BUCKET_FACE_IMAGES:kronos-app-rekognition-imagens}
  rekognition:
    collection-id: ${AWS_REKOGNITION_COLLECTION_ID}

kronos:
  redis:
    enabled: ${KRONOS_REDIS_ENABLED:true}
    namespace: ${REDIS_NAMESPACE:kronos}
    key-hmac-secret: ${REDIS_KEY_HMAC_SECRET}
    cache-default-ttl: ${REDIS_CACHE_DEFAULT_TTL:PT5M}
    cache-short-ttl: ${REDIS_CACHE_SHORT_TTL:PT30S}
    cache-medium-ttl: ${REDIS_CACHE_MEDIUM_TTL:PT5M}
    cache-long-ttl: ${REDIS_CACHE_LONG_TTL:PT24H}
    password-reset-ttl: ${REDIS_PASSWORD_RESET_TTL:PT30M}
    lock-ttl: ${REDIS_LOCK_TTL:PT10S}
  security:
    auth-cookie:
      name: ${AUTH_COOKIE_NAME:KRONOS_ACCESS_TOKEN}
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_COOKIE_PATH:/}
      domain: ${AUTH_COOKIE_DOMAIN:}
      max-age-seconds: ${AUTH_COOKIE_MAX_AGE_SECONDS:900}
    rate-limit:
      login:
        ip:
          limit: ${LOGIN_RATE_LIMIT_IP_LIMIT:10}
          window-seconds: ${LOGIN_RATE_LIMIT_IP_WINDOW_SECONDS:60}
        username:
          limit: ${LOGIN_RATE_LIMIT_USERNAME_LIMIT:5}
          window-seconds: ${LOGIN_RATE_LIMIT_USERNAME_WINDOW_SECONDS:300}
        cooldown-minutes: ${LOGIN_RATE_LIMIT_COOLDOWN_MINUTES:5,15,30}
      recovery:
        cpf:
          limit: ${RECOVERY_RATE_LIMIT_CPF_LIMIT:3}
        email:
          limit: ${RECOVERY_RATE_LIMIT_EMAIL_LIMIT:3}
        ip:
          limit: ${RECOVERY_RATE_LIMIT_IP_LIMIT:10}
        window-seconds: ${RECOVERY_RATE_LIMIT_WINDOW_SECONDS:3600}
      admin-check:
        limit: ${ADMIN_CHECK_RATE_LIMIT:20}
        window-seconds: ${ADMIN_CHECK_RATE_LIMIT_WINDOW_SECONDS:60}
    certificate:
      path: ${DIGITAL_CERTIFICATE_PATH}
      password: ${DIGITAL_CERTIFICATE_PASSWORD}
    upload:
      max-bytes: ${UPLOAD_MAX_BYTES:5242880}
      antivirus:
        enabled: ${UPLOAD_ANTIVIRUS_ENABLED:true}
        host: ${UPLOAD_ANTIVIRUS_HOST:localhost}
        port: ${UPLOAD_ANTIVIRUS_PORT:3310}
        timeout-ms: ${UPLOAD_ANTIVIRUS_TIMEOUT_MS:3000}
    biometric-term-salt: ${SECRET_TERM}
    client-ip:
      trust-forwarded-headers: ${CLIENT_IP_TRUST_FORWARDED_HEADERS:true}
      trusted-proxy-cidrs: ${CLIENT_IP_TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
  storage:
    provider: ${KRONOS_STORAGE_PROVIDER:s3}
  lgpd:
    log:
      hash-secret: ${LGPD_LOG_HASH_SECRET}
    biometric:
      revoked-consent-grace-days: ${LGPD_BIOMETRIC_REVOKED_CONSENT_GRACE_DAYS:0}
    retention:
      scheduler:
        enabled: ${LGPD_RETENTION_SCHEDULER_ENABLED:true}
        cron: ${LGPD_RETENTION_SCHEDULER_CRON:0 15 4 * * ?}
        mode: ${LGPD_RETENTION_SCHEDULER_MODE:DRY_RUN}
        apply-confirmed: ${LGPD_RETENTION_SCHEDULER_APPLY_CONFIRMED:false}
        justification: ${LGPD_RETENTION_SCHEDULER_JUSTIFICATION:Scheduled LGPD retention batch}
      allow-apply: ${LGPD_RETENTION_ALLOW_APPLY:false}
  observability:
    frontend:
      events:
        enabled: ${KRONOS_FRONTEND_EVENTS_ENABLED:true}
        rate-limit:
          limit: ${KRONOS_FRONTEND_EVENTS_RATE_LIMIT:120}
          window-seconds: ${KRONOS_FRONTEND_EVENTS_WINDOW_SECONDS:60}
        max-payload-characters: ${KRONOS_FRONTEND_EVENTS_MAX_PAYLOAD_CHARACTERS:4096}
biometric:
  max-base64-chars: ${BIOMETRIC_MAX_BASE64_CHARS:1500000}
  liveness-required: ${BIOMETRIC_LIVENESS_REQUIRED:false}
  login-face:
    limit: ${BIOMETRIC_LOGIN_FACE_LIMIT:5}
    window-seconds: ${BIOMETRIC_LOGIN_FACE_WINDOW_SECONDS:60}
  checkin:
    limit: ${BIOMETRIC_CHECKIN_LIMIT:20}
    window-seconds: ${BIOMETRIC_CHECKIN_WINDOW_SECONDS:60}
  enrollment:
    limit: ${BIOMETRIC_ENROLLMENT_LIMIT:10}
    window-seconds: ${BIOMETRIC_ENROLLMENT_WINDOW_SECONDS:600}
