server:
  port: ${PORT:8080}
spring:
  datasource:
    # Variáveis para o Banco de Dados (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD)
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD} # A senha de aplicativo do Gmail
    properties:
      mail:
        smtp:
          auth: true
          debug: true
          starttls:
            enable: true
    retry:
      max-attempts: ${MAIL_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${MAIL_RETRY_INITIAL_INTERVAL_MS:1000}
      multiplier: ${MAIL_RETRY_MULTIPLIER:2.0}
      max-interval-ms: ${MAIL_RETRY_MAX_INTERVAL_MS:15000}
      async:
        core-pool-size: ${MAIL_ASYNC_CORE_POOL_SIZE:2}
        max-pool-size: ${MAIL_ASYNC_MAX_POOL_SIZE:6}
        queue-capacity: ${MAIL_ASYNC_QUEUE_CAPACITY:200}

file:
  storage:
    root-path: ${FILE_STORAGE_ROOT_PATH:/mnt/data/documents}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    liveness state:
      enabled: true
    readiness state:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
logging:
  pattern:
    console: "${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}"
  level:
    org.springframework:
      security: DEBUG

jwt:
  # Variável para o segredo JWT
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

frontend:
  # Variável para a URL base do Frontend
  base-url-plataform: ${FRONTEND_BASE_URL_PLATAFORM}
  base-url-record: ${FRONTEND_BASE_URL_RECORD}
  base-url-local: ${FRONTEND_BASE_URL_LOCAL}
  base-url-local-2: ${FRONTEND_BASE_URL_LOCAL_2}

aws:
  # ATENÇÃO: Removemos o valor de fallback para que a aplicação falhe se a variável de ambiente não estiver definida.
  # A região pode ter um valor de fallback se você souber que ela é fixa.
  region: ${AWS_REGION:us-east-1}

  # Chaves de acesso devem ser injetadas
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}

  # Variáveis de Configuração
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    bucket-name-doc: ${AWS_S3_BUCKET_NAME_DOCS:kronos-docs-legal-prod}
  rekognition:
    collection-id: ${AWS_REKOGNITION_COLLECTION_ID:kronos_render}

kronos:
  security:
    certificate:
      path: "caminho/para/certificado.pfx"
      password: "sua_senha_secreta"
    biometric-term-salt: ${SECRET_TERM}

security:
  password:
    policy-regex: ${SECURITY_PASSWORD_POLICY_REGEX:^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$}
