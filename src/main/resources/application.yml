spring:
  main:
    lazy-initialization: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      repositories:
        enabled: false
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME}
      region: ${AWS_REGION}
  cloud:
    aws:
      region:
        static: ${AWS_REGION}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    export:
      prometheus:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

frontend:
  records: ${FRONTEND_BASE_URL_RECORD}
  default-base-url: ${FRONTEND_BASE_URL_PLATAFORM}

logging:
  pattern:
    console: "${LOGPATTERN_CONSOLE}"
  level:
    org.springframework:
      security: INFO

time-record:
  approval-topic-arn: ${TIME_RECORD_APPROVAL_TOPIC_ARN}
  approval-queue-name: ${TIME_RECORD_APPROVAL_QUEUE_NAME}

password-reset:
  topic-arn: ${PASSWORD_RESET_TOPIC_ARN}
  queue-name: ${PASSWORD_RESET_QUEUE_NAME}