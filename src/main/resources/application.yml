spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME}
      region: ${AWS_REGION}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:sa-east-1}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    export:
      prometheus:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

frontend:
  allowed-origins:
    - ${FRONTEND_BASE_URL_PLATAFORM}
    - ${FRONTEND_BASE_URL_RECORD}
    - ${FRONTEND_BASE_URL_RENDER}
  default-base-url: ${FRONTEND_BASE_URL_PLATAFORM}

logging:
  pattern:
    console: "${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}"
  level:
    org.springframework:
      security: INFO

time-record:
  approval-topic-arn: arn:aws:sns:sa-east-1:489540979930:kronos-time-record-approval-topic
  approval-queue-name: kronos-time-record-approval-queue

password-reset:
  topic-arn: arn:aws:sns:sa-east-1:489540979930:kronos-password-reset-topic
  queue-name: kronos-password-reset-queue