spring:
  datasource:
    # Variáveis para o Banco de Dados (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD)
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  redis:
    host: ${SPRING_DATA_REDIS_HOST}
    port: ${SPRING_DATA_REDIS_PORT}
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD} # A senha de aplicativo do Gmail
    properties:
      mail:
        smtp:
          auth: true
          debug: true
          starttls:
            enable: true

  cloud:
    gcp:
      # Variável para o Project ID do GCP
      project-id: ${GCP_PROJECT_ID:kronos-tech-solutions}
      pubsub:
        subscriber:
          subscriptions:
            time-record-approval-subscription:
              topic: ${GCP_PUBSUB_TOPIC_NAME:time-record-approval-topic}
              auto-create: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    export:
      prometheus:
        enabled: true
logging:
  pattern:
    console: "${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}"
  level:
    org.springframework:
      security: DEBUG

jwt:
  # Variável para o segredo JWT
  secret: ${JWT_SECRET:"***JWT_SECRET_REMOVED***"}
  expiration: ${JWT_EXPIRATION:3600000}

gcp:
  storage:
    # Variável para o nome do bucket do GCP Storage
    bucket-name: ${GCP_STORAGE_BUCKET_NAME:kronos-tech-solutions-bucket}

frontend:
  # Variável para a URL base do Frontend
  base-url-plataform: ${FRONTEND_BASE_URL_PLATAFORM}
  base-url-record: ${FRONTEND_BASE_URL_RECORD}
  base-url-render: ${FRONTEND_BASE_URL_RENDER}

pubsub:
  topics:
    password-reset: ${PASSWORD_RESET_TOPIC:password-reset-topic}
    time-record-approval: ${GCP_PUBSUB_TOPIC_NAME:time-record-approval-topic}
  # Seção adicionada para definir os nomes das inscrições
  subscriptions:
    time-record-approval: time-record-approval-subscription