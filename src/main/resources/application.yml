server:
  port: ${PORT:8080}
spring:
  datasource:
    # Variáveis para o Banco de Dados (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD)
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD} # A senha de aplicativo do Gmail
    properties:
      mail:
        smtp:
          auth: true
          debug: false
          starttls:
            enable: true
    retry:
      max-attempts: ${MAIL_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${MAIL_RETRY_INITIAL_INTERVAL_MS:1000}
      multiplier: ${MAIL_RETRY_MULTIPLIER:2.0}
      max-interval-ms: ${MAIL_RETRY_MAX_INTERVAL_MS:15000}
      async:
        core-pool-size: ${MAIL_ASYNC_CORE_POOL_SIZE:2}
        max-pool-size: ${MAIL_ASYNC_MAX_POOL_SIZE:6}
        queue-capacity: ${MAIL_ASYNC_QUEUE_CAPACITY:200}

file:
  storage:
    root-path: ${FILE_STORAGE_ROOT_PATH:/mnt/data/documents}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    liveness state:
      enabled: true
    readiness state:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
logging:
  pattern:
    console: "${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}"
  level:
    org.springframework:
      security: INFO

jwt:
  # Variável para o segredo JWT
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  issuer: ${JWT_ISSUER:kronos-api}
  audience: ${JWT_AUDIENCE:kronos-clients}

auth:
  cookie:
    name: ${AUTH_COOKIE_NAME:KTS_SESSION}
    secure: ${AUTH_COOKIE_SECURE:true}
    http-only: ${AUTH_COOKIE_HTTP_ONLY:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    path: ${AUTH_COOKIE_PATH:/}
    domain: ${AUTH_COOKIE_DOMAIN:}

frontend:
  # Variável para a URL base do Frontend
  base-url-plataform: ${FRONTEND_BASE_URL_PLATAFORM}
  base-url-record: ${FRONTEND_BASE_URL_RECORD}
  base-url-local: ${FRONTEND_BASE_URL_LOCAL}
  base-url-local-2: ${FRONTEND_BASE_URL_LOCAL_2}

aws:
  # ATENÇÃO: Removemos o valor de fallback para que a aplicação falhe se a variável de ambiente não estiver definida.
  # A região pode ter um valor de fallback se você souber que ela é fixa.
  region: ${AWS_REGION:us-east-1}

  # Chaves de acesso devem ser injetadas
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}

  # Variáveis de Configuração
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    bucket-name-doc: ${AWS_S3_BUCKET_NAME_DOCS:kronos-docs-legal-prod}
  rekognition:
    collection-id: ${AWS_REKOGNITION_COLLECTION_ID:kronos_render}

kronos:
  security:
    certificate:
      path: "caminho/para/certificado.pfx"
      password: "sua_senha_secreta"
    biometric-term-salt: ${SECRET_TERM}

security:
  password:
    policy-regex: ${SECURITY_PASSWORD_POLICY_REGEX:^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$}

  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:120}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:120}
    refill-duration-minutes: ${RATE_LIMIT_REFILL_DURATION_MINUTES:1}
    auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:20}
    auth-refill-tokens: ${RATE_LIMIT_AUTH_REFILL_TOKENS:20}
    auth-refill-duration-minutes: ${RATE_LIMIT_AUTH_REFILL_DURATION_MINUTES:1}

  resilience4j:
    retry:
      instances:
        viaCep:
          max-attempts: ${VIACEP_RETRY_MAX_ATTEMPTS:3}
          wait-duration: ${VIACEP_RETRY_WAIT_DURATION:300ms}
          retry-exceptions:
            - org.springframework.web.reactive.function.client.WebClientRequestException
            - java.util.concurrent.TimeoutException
    circuitbreaker:
      instances:
        viaCep:
          sliding-window-type: COUNT_BASED
          sliding-window-size: 10
          minimum-number-of-calls: 5
          failure-rate-threshold: 50
          wait-duration-in-open-state: 30s
          permitted-number-of-calls-in-half-open-state: 3
