spring:
  datasource:
    # Variáveis para o Banco de Dados (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD)
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      initialization-fail-timeout: ${DB_INITIALIZATION_FAIL_TIMEOUT_MS:10000}
      data-source-properties:
        connectTimeout: ${DB_CONNECT_TIMEOUT_SECONDS:10}
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:15}
        tcpKeepAlive: true
  jpa:
    properties:
      jakarta.persistence.query.timeout: ${JPA_QUERY_TIMEOUT_MS:10000}

  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD} # A senha de aplicativo do Gmail
    properties:
      mail:
        smtp:
          auth: true
          debug: ${MAIL_SMTP_DEBUG:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
          starttls:
            enable: true

file:
  storage:
    root-path: ${FILE_STORAGE_ROOT_PATH:/mnt/data/documents}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    public-docs-enabled: false

logging:
  pattern:
    console: "${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}"
  level:
    org.springframework:
      security: ${SPRING_SECURITY_LOG_LEVEL:INFO}

jwt:
  # Variável para o segredo JWT
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}

frontend:
  # Variável para a URL base do Frontend
  base-url-plataform: ${FRONTEND_BASE_URL_PLATAFORM}
  base-url-record: ${FRONTEND_BASE_URL_RECORD}
  base-url-local: ${FRONTEND_BASE_URL_LOCAL}
  base-url-local-2: ${FRONTEND_BASE_URL_LOCAL_2}

integration:
  here:
    base-url: ${HERE_BASE_URL:https://geocode.search.hereapi.com}
    api-key: ${HERE_API_KEY:}

aws:
  # ATENÇÃO: Removemos o valor de fallback para que a aplicação falhe se a variável de ambiente não estiver definida.
  # A região pode ter um valor de fallback se você souber que ela é fixa.
  region: ${AWS_REGION:us-east-1}

  # Chaves de acesso devem ser injetadas
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}

  # Variáveis de Configuração
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    bucket-name-doc: ${AWS_S3_BUCKET_NAME_DOCS:kronos-docs-legal-prod}
  rekognition:
    collection-id: ${AWS_REKOGNITION_COLLECTION_ID:kronos_render}

kronos:
  security:
    auth-cookie:
      name: ${AUTH_COOKIE_NAME:KRONOS_ACCESS_TOKEN}
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_COOKIE_PATH:/}
      domain: ${AUTH_COOKIE_DOMAIN:}
      max-age-seconds: ${AUTH_COOKIE_MAX_AGE_SECONDS:900}
    certificate:
      path: ${DIGITAL_CERTIFICATE_PATH:}
      password: ${DIGITAL_CERTIFICATE_PASSWORD:}
    biometric-term-salt: ${SECRET_TERM}
    upload:
      max-bytes: ${UPLOAD_MAX_BYTES:5242880}
      antivirus:
        enabled: ${UPLOAD_ANTIVIRUS_ENABLED:false}
        host: ${UPLOAD_ANTIVIRUS_HOST:localhost}
        port: ${UPLOAD_ANTIVIRUS_PORT:3310}
        timeout-ms: ${UPLOAD_ANTIVIRUS_TIMEOUT_MS:3000}

biometric:
  max-base64-chars: ${BIOMETRIC_MAX_BASE64_CHARS:1500000}
  liveness-required: ${BIOMETRIC_LIVENESS_REQUIRED:false}
  login-face:
    limit: ${BIOMETRIC_LOGIN_FACE_LIMIT:5}
    window-seconds: ${BIOMETRIC_LOGIN_FACE_WINDOW_SECONDS:60}
  checkin:
    limit: ${BIOMETRIC_CHECKIN_LIMIT:20}
    window-seconds: ${BIOMETRIC_CHECKIN_WINDOW_SECONDS:60}
  enrollment:
    limit: ${BIOMETRIC_ENROLLMENT_LIMIT:10}
    window-seconds: ${BIOMETRIC_ENROLLMENT_WINDOW_SECONDS:600}
