spring:
  main:
    lazy-initialization: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      repositories:
        enabled: false
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID} # <-- Adicione o ID do seu projeto GCP
      credentials:
        location: ${GCP_CREDENTIALS_LOCATION} # <-- Caminho para o arquivo de credenciais (ex: file:/etc/secrets/gcp-credentials.json)
      storage:
        bucket-name: ${GCS_BUCKET_NAME} # <-- Nome do seu bucket no Google Cloud Storage
      pubsub:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    export:
      prometheus:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

frontend:
  records: ${FRONTEND_BASE_URL_RECORD}
  default-base-url: ${FRONTEND_BASE_URL_PLATAFORM}

logging:
  pattern:
    console: "${LOGPATTERN_CONSOLE}"
  level:
    org.springframework:
      security: TRACE

# Configurações de Tópicos e Assinaturas do Google Cloud Pub/Sub
pubsub:
  topics:
    password-reset: ${PASSWORD_RESET_TOPIC_NAME}
    time-record-approval: ${TIME_RECORD_APPROVAL_TOPIC_NAME}
  subscriptions:
    password-reset: ${PASSWORD_RESET_SUBSCRIPTION_NAME}
    time-record-approval: ${TIME_RECORD_APPROVAL_SUBSCRIPTION_NAME}