server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: ${APP_NAME:kronos-backend}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kronos_local}
    username: ${DB_USERNAME:kronos_local}
    password: ${DB_PASSWORD:kronos_local}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:local}
    password: ${MAIL_PASSWORD:local}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  level:
    root: WARN
    org.springframework: INFO
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    br.com: DEBUG
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,configprops
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

app:
  security:
    public-docs-enabled: true
    cookies:
      secure: false
      same-site: Lax
    csrf:
      secure: false
      same-site: Lax

jwt:
  secret: ${JWT_SECRET:local-dev-secret-with-at-least-32-characters-kronos}
  expiration: ${JWT_EXPIRATION:3600000}

frontend:
  base-url-plataform: ${FRONTEND_BASE_URL_PLATAFORM:http://localhost:5173}
  base-url-record: ${FRONTEND_BASE_URL_RECORD:http://localhost:5173}
  base-url-local: ${FRONTEND_BASE_URL_LOCAL:http://localhost:5173}
  base-url-local-2: ${FRONTEND_BASE_URL_LOCAL_2:http://127.0.0.1:5173}
  allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173}

file:
  storage:
    root-path: ${FILE_STORAGE_ROOT_PATH:./storage/documents}

integration:
  here:
    base-url: ${HERE_BASE_URL:https://geocode.search.hereapi.com}
    api-key: ${HERE_API_KEY:}

aws:
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:local}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:local}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:kronos-local}
    bucket-name-doc: ${AWS_S3_BUCKET_NAME_DOCS:kronos-local-docs}
    bucket-payslip: ${AWS_S3_BUCKET_PAYSLIP:kronos-docs-payslip-prod}
    bucket-time-off: ${AWS_S3_BUCKET_TIME_OFF:kronos-docs-time-off-prod}
    bucket-documents: ${AWS_S3_BUCKET_DOCUMENTS:kronos-docs-general-prod}
    bucket-employee-documents: ${AWS_S3_BUCKET_EMPLOYEE_DOCUMENTS:kronos-docs-employee-prod}
    bucket-point-record-receipt: ${AWS_S3_BUCKET_POINT_RECORD_RECEIPT:kronos-docs-point-record-receipt-prod}
    bucket-biometric-consent-term: ${AWS_S3_BUCKET_BIOMETRIC_CONSENT_TERM:kronos-docs-biometric-consent-prod}
    bucket-service-contract-terms: ${AWS_S3_BUCKET_SERVICE_CONTRACT_TERMS:kronos-docs-service-contract-prod}
    bucket-point-mirror-signature: ${AWS_S3_BUCKET_POINT_MIRROR_SIGNATURE:kronos-docs-point-mirror-signature-prod}
    bucket-face-images: ${AWS_S3_BUCKET_FACE_IMAGES:kronos-app-rekognition-imagens}
  rekognition:
    collection-id: ${AWS_REKOGNITION_COLLECTION_ID:kronos-local}

kronos:
  security:
    auth-cookie:
      name: ${AUTH_COOKIE_NAME:KRONOS_ACCESS_TOKEN}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_COOKIE_PATH:/}
      domain: ${AUTH_COOKIE_DOMAIN:}
      max-age-seconds: ${AUTH_COOKIE_MAX_AGE_SECONDS:3600}
    rate-limit:
      login:
        ip:
          limit: ${LOGIN_RATE_LIMIT_IP_LIMIT:10}
          window-seconds: ${LOGIN_RATE_LIMIT_IP_WINDOW_SECONDS:60}
        username:
          limit: ${LOGIN_RATE_LIMIT_USERNAME_LIMIT:5}
          window-seconds: ${LOGIN_RATE_LIMIT_USERNAME_WINDOW_SECONDS:300}
        cooldown-minutes: ${LOGIN_RATE_LIMIT_COOLDOWN_MINUTES:5,15,30}
      recovery:
        cpf:
          limit: ${RECOVERY_RATE_LIMIT_CPF_LIMIT:3}
        email:
          limit: ${RECOVERY_RATE_LIMIT_EMAIL_LIMIT:3}
        ip:
          limit: ${RECOVERY_RATE_LIMIT_IP_LIMIT:10}
        window-seconds: ${RECOVERY_RATE_LIMIT_WINDOW_SECONDS:3600}
    certificate:
      path: ${DIGITAL_CERTIFICATE_PATH:}
      password: ${DIGITAL_CERTIFICATE_PASSWORD:}
    upload:
      max-bytes: ${UPLOAD_MAX_BYTES:5242880}
      antivirus:
        enabled: ${UPLOAD_ANTIVIRUS_ENABLED:false}
        host: ${UPLOAD_ANTIVIRUS_HOST:localhost}
        port: ${UPLOAD_ANTIVIRUS_PORT:3310}
        timeout-ms: ${UPLOAD_ANTIVIRUS_TIMEOUT_MS:3000}
    biometric-term-salt: ${SECRET_TERM:local-biometric-term-salt}
  storage:
    provider: ${KRONOS_STORAGE_PROVIDER:local}
biometric:
  max-base64-chars: ${BIOMETRIC_MAX_BASE64_CHARS:1500000}
  liveness-required: ${BIOMETRIC_LIVENESS_REQUIRED:false}
  login-face:
    limit: ${BIOMETRIC_LOGIN_FACE_LIMIT:5}
    window-seconds: ${BIOMETRIC_LOGIN_FACE_WINDOW_SECONDS:60}
  checkin:
    limit: ${BIOMETRIC_CHECKIN_LIMIT:20}
    window-seconds: ${BIOMETRIC_CHECKIN_WINDOW_SECONDS:60}
  enrollment:
    limit: ${BIOMETRIC_ENROLLMENT_LIMIT:10}
    window-seconds: ${BIOMETRIC_ENROLLMENT_WINDOW_SECONDS:600}
