# Reverse proxy recomendado para Hostinger/Nginx na frente do Kronos.
# Ajuste server_name, certificados e porta upstream conforme o ambiente real.

server {
    listen 443 ssl http2;
    server_name api.seu-dominio.com;

    # Root path forwarding (backward compatibility)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # LGPD paths: External /api/lgpd/** → Internal /lgpd/**
    location ~ ^/api/lgpd/(.*)$ {
        # Rewrite /api/lgpd/* to /lgpd/*
        rewrite ^/api/lgpd/(.*)$ /lgpd/$1 break;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Preserve original request path for logging
        proxy_set_header X-Original-URI $request_uri;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
