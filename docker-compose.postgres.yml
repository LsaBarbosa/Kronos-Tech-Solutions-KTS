services:
  kronos-postgres:
    image: postgres:17-alpine
    container_name: kronos-postgres-local
    restart: unless-stopped

    environment:
      POSTGRES_DB: kronos_local
      POSTGRES_USER: kronos_local
      POSTGRES_PASSWORD: kronos_local
      TZ: America/Sao_Paulo

    ports:
      - "5432:5432"

    volumes:
      - kronos_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kronos_local -d kronos_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kronos_postgres_data:
